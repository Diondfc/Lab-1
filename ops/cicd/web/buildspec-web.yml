version: 0.2

env:
  variables:
    GIT_CLONE_DEPTH: 0

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing phase..."
      - echo "Node $(node --version), npm $(npm --version)"

  pre_build:
    commands:
      - echo "Starting Web Build Phase..."
      - echo "Build started on $(date)"
      - test -d project/client || (echo "ERROR - project/client/ NOT FOUND" && exit 1)
      - echo "Installing dependencies for Web..."
      - npm install --prefix project/client --include=dev --legacy-peer-deps
      - echo "Dependencies installed"
      - test -f project/client/node_modules/.bin/vite && echo "vite found" || (echo "ERROR - vite not found" && exit 1)

  build:
    commands:
      - echo "Building Web Application..."
      - cd project/client
      - |
        if [ -n "$VITE_API_URL" ]; then
          echo "VITE_API_URL=$VITE_API_URL"
        else
          echo "WARNING - VITE_API_URL not set; production build will use relative API paths"
        fi
      - npm run build
      - echo "Vite build completed"
      - test -d dist || (echo "ERROR - dist/ folder not created" && exit 1)
      - ls -la dist/
      - find dist -type f | head -20
      - echo "Web build completed successfully"

  post_build:
    commands:
      - echo "Post-build phase for Web..."
      - echo "Build completed on $(date)"

artifacts:
  files:
    - '**/*'
  base-directory: project/client/dist
  name: web-build-artifact

cache:
  paths:
    - 'project/client/node_modules/**/*'
